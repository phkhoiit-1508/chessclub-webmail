services:
  roundcubedb:
    image: mariadb:10.11
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=root_password_manh
      - MYSQL_DATABASE=roundcubemail
      - MYSQL_USER=roundcube
      - MYSQL_PASSWORD=roundcube_pass
    volumes:
      - db_data:/var/lib/mysql
    command: >
      --innodb-buffer-pool-size=256M
      --innodb-flush-log-at-trx-commit=2
      --max-connections=50

  # Session + IMAP index cache for Roundcube. Pure cache: no persistence, an empty
  # cache after a restart only makes the first page loads slower.
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru

  roundcube:
    image: roundcube/roundcubemail:latest
    restart: always
    ports:
      - "8088:80"
    environment:
      - ROUNDCUBEMAIL_DB_TYPE=mysql
      - ROUNDCUBEMAIL_DB_HOST=roundcubedb
      - ROUNDCUBEMAIL_DB_USER=roundcube
      - ROUNDCUBEMAIL_DB_PASSWORD=roundcube_pass
      - ROUNDCUBEMAIL_DB_NAME=roundcubemail
      - ROUNDCUBEMAIL_DEFAULT_HOST=ssl://imap.gmail.com
      - ROUNDCUBEMAIL_DEFAULT_PORT=993
      - ROUNDCUBEMAIL_SMTP_SERVER=ssl://smtp.gmail.com
      - ROUNDCUBEMAIL_SMTP_PORT=465
    volumes:
      # 2. Ánh xạ toàn bộ mã nguồn ra ngoài để chỉnh sửa
      - ./source_code:/var/www/html
      - ./php-perf.ini:/usr/local/etc/php/conf.d/zz-php-perf.ini:ro
    depends_on:
      - roundcubedb
      - redis
    extra_hosts:
      - "imap.gmail.com:64.233.189.108"
      - "smtp.gmail.com:64.233.189.108"

volumes:
  db_data: