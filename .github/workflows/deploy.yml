name: Deploy Webmail to Hostweb

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    name: Deploy and Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Kết nối vào mạng Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: Thực thi kịch bản trên máy chủ qua SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "Đang truy cập thư mục dự án..."
            cd ~/webmail
            
            echo "Kéo code mới nhất từ GitHub..."
            git pull origin main
            
            echo "Cấp quyền thực thi và biên dịch giao diện CSS..."
            chmod +x ./skin-overrides/install.sh
            sudo ./skin-overrides/install.sh
            
            echo "Cập nhật hệ thống Docker..."
            sudo docker compose up -d
            
            echo "Hoàn tất triển khai Webmail USCC!"