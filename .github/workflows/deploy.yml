name: Validate local Docker deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compose-config:
    name: Validate Docker Compose and Cloudflare Tunnel wiring
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose file
        env:
          CLOUDFLARE_TUNNEL_TOKEN: validation-token
        run: docker compose config --quiet

      - name: Check required local deployment files
        shell: bash
        run: |
          test -f docker-compose.yml
          test -f .env.example
          test -f php-perf.ini
          echo "Compose and tunnel configuration are valid."
          if [ ! -f source_code/index.php ]; then
            echo "NOTICE: source_code does not contain the Roundcube release tree."
            echo "Populate source_code before starting the local stack."
          fi
